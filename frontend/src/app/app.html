<header class="topbar">
  <span class="brand">Recursos Humanos · Back office</span>
</header>

<div
  #notificationBox
  popover="manual"
  [class]="'notification notification-' + (notification.message()?.type ?? '')"
  role="alert"
>
  <span>{{ notification.message()?.text }}</span>
  <button type="button" class="notification-close" aria-label="Cerrar" (click)="notification.clear()">×</button>
</div>

<main class="content">
  <router-outlet />
</main>
